services:
  - type: web
    name: yatrasense-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.mjs
    envVars:
      - key: PORT
        value: 8787
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: FRONTEND_ORIGIN
        sync: false
